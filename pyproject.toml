[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sms-engine"
version = "2.2.0"
description = "Aviation Safety Management System — ICAO-aligned risk assessment engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "requests==2.34.2",
    "pydantic==2.13.4",
    "python-dotenv==1.0.0",
    "google-cloud-logging==3.11.0",
    "google-cloud-storage==2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "httpx>=0.28",
]
gcp = [
    "google-cloud-logging==3.11.0",
    "google-cloud-storage==2.19.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
