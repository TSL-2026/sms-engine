[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-engine"
version = "3.0.0"
description = "AviaSafe — Multi-tenant Safety Management System aligned with ICAO Annex 19 / Doc 9859"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "pydantic==2.13.4",
    "python-dotenv==1.0.0",
    "google-cloud-firestore>=2.15.0",
    "google-cloud-logging==3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "httpx>=0.28",
]
gcp = [
    "google-cloud-logging==3.11.0",
    "google-cloud-storage==2.19.0",
]

[tool.setuptools.packages.find]
include = ["sms_engine*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["sms_tests"]
python_files = ["test_*.py"]


