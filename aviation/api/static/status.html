<!DOCTYPE html>
<html>
<head>
    <title>SMS-Engine Status</title>
    <meta http-equiv="refresh" content="30">
    <style>
        body { font-family: monospace; margin: 40px; background: #0a0e27; color: #00ff88; }
        .up { color: #00ff88; }
        .down { color: #ff4444; }
        .metric { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🛩️ SMS-Engine Status Dashboard</h1>
    <div id="status">Loading...</div>
    <script>
        async function checkStatus() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                document.getElementById('status').innerHTML = `
                    <div class="metric up">✅ System: ${data.status}</div>
                    <div class="metric">📦 Version: ${data.version}</div>
                    <div class="metric">🕐 Last Check: ${new Date().toISOString()}</div>
                `;
            } catch(e) {
                document.getElementById('status').innerHTML = `<div class="metric down">❌ System Unreachable</div>`;
            }
        }
        checkStatus();
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
