<!DOCTYPE html>
<html>
<head>
    <title>SMS-Engine Dashboard</title>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #0f1235; color: #e0e0e0; }
        .nav { background: #1a1f4a; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2f5a; }
        .nav h1 { margin: 0; font-size: 20px; color: #00ff88; }
        .container { max-width: 1000px; margin: 24px auto; padding: 0 24px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat { background: #1a1f4a; padding: 20px; border-radius: 10px; border: 1px solid #2a2f5a; }
        .stat .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .stat .value { font-size: 28px; font-weight: 700; margin-top: 8px; }
        .stat .value.green { color: #00ff88; }
        .stat .value.red { color: #ff4444; }
        .stat .value.yellow { color: #ffaa00; }
        .card { background: #1a1f4a; padding: 24px; border-radius: 10px; border: 1px solid #2a2f5a; margin-bottom: 24px; }
        .card h2 { margin: 0 0 16px; font-size: 16px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        button { background: #00ff88; padding: 10px 24px; border: none; border-radius: 6px; cursor: pointer; color: #000; font-weight: 600; }
        button:hover { background: #00cc6a; }
        textarea { width: 100%; padding: 12px; background: #0f1235; color: #e0e0e0; border: 1px solid #2a2f5a; border-radius: 6px; font-family: monospace; font-size: 14px; margin-bottom: 12px; }
        pre { background: #0f1235; padding: 16px; border-radius: 6px; overflow-x: auto; font-size: 13px; border: 1px solid #2a2f5a; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 8px 12px; color: #888; border-bottom: 1px solid #2a2f5a; font-weight: 500; }
        td { padding: 8px 12px; border-bottom: 1px solid #1a1f4a; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge.go { background: #003d20; color: #00ff88; }
        .badge.no-go { background: #3d0000; color: #ff4444; }
        .badge.conditional { background: #3d2a00; color: #ffaa00; }
        .badge.error { background: #3d0000; color: #ff6666; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .auth-info { font-size: 13px; color: #888; }
        #user-status { font-size: 13px; }
        .btn-group { display: flex; gap: 8px; }
        .btn-outline { background: transparent; border: 1px solid #2a2f5a; color: #e0e0e0; }
        .btn-outline:hover { background: #2a2f5a; }
        .inline-btn { background: #2a2f5a; padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; color: #e0e0e0; font-size: 12px; }
        .inline-btn:hover { background: #3a3f6a; }
    </style>
</head>
<body>
    <div class="nav">
        <h1>SMS-Engine</h1>
        <div>
            <span id="user-status" class="auth-info">Signing in...</span>
        </div>
    </div>
    <div class="container">
        <div id="stats-grid" class="grid">
            <div class="stat"><div class="label">System Status</div><div class="value" id="sys-status">-</div></div>
            <div class="stat"><div class="label">Total Assessments</div><div class="value" id="total-assessments">-</div></div>
            <div class="stat"><div class="label">GO / Cleared</div><div class="value green" id="go-count">-</div></div>
            <div class="stat"><div class="label">NO-GO / Blocked</div><div class="value red" id="nogo-count">-</div></div>
        </div>

        <div class="card">
            <h2>Flight Risk Assessment</h2>
            <textarea id="scenario" rows="3" placeholder="Describe flight scenario (e.g. 'Pilot rested, day VFR, familiar airport')"></textarea>
            <div class="btn-group">
                <button onclick="assessFlight()">Assess Risk</button>
                <button class="btn-outline" onclick="loadDashboard()">Refresh</button>
            </div>
            <div id="result"></div>
        </div>

        <div class="card">
            <h2>Recent Assessments</h2>
            <div id="history-table"><div class="loading">Loading...</div></div>
        </div>
    </div>
    <script>
        let token = null;

        async function api(endpoint, opts = {}) {
            const headers = opts.headers || {};
            if (token) headers['Authorization'] = 'Bearer ' + token;
            if (opts.body) headers['Content-Type'] = 'application/json';
            const r = await fetch(endpoint, { ...opts, headers });
            if (!r.ok) throw new Error(await r.text());
            return r.json();
        }

        async function initAuth() {
            return new Promise((resolve) => {
                google.accounts.id.initialize({
                    client_id: '660696925387-rk1ffklc4bcje0toq2psnqf3kv24ujdn.apps.googleusercontent.com',
                    callback: (response) => {
                        token = response.credential;
                        document.getElementById('user-status').textContent = 'Authenticated';
                        resolve();
                        loadDashboard();
                    }
                });
                google.accounts.id.prompt();
            });
        }

        async function loadDashboard() {
            try {
                const [health, report, history] = await Promise.all([
                    api('/health').catch(() => null),
                    api('/safety-report').catch(() => null),
                    api('/history').catch(() => ({ total: 0, assessments: [] }))
                ]);

                const metrics = report?.metrics || {};
                const decisions = metrics.go_no_go_decisions || {};
                const total = metrics.total_assessments || history.total || 0;

                const statusEl = document.getElementById('sys-status');
                if (health?.status === 'online') {
                    statusEl.textContent = 'Online';
                    statusEl.className = 'value green';
                } else {
                    statusEl.textContent = 'Unknown';
                    statusEl.className = 'value yellow';
                }
                document.getElementById('total-assessments').textContent = total;
                document.getElementById('go-count').textContent = decisions.GO || 0;
                document.getElementById('nogo-count').textContent = decisions['NO-GO'] || 0;

                renderHistory(history.assessments || []);
            } catch (e) {
                console.error('Dashboard load failed:', e);
            }
        }

        function renderHistory(assessments) {
            const el = document.getElementById('history-table');
            if (!assessments.length) {
                el.innerHTML = '<div style="color:#888;padding:20px;text-align:center;">No assessments yet</div>';
                return;
            }
            let html = `<table>
                <tr><th>Time</th><th>Scenario</th><th>Score</th><th>Decision</th></tr>`;
            for (const a of assessments) {
                const decision = (a.decision || '').toLowerCase();
                const badge = decision.includes('go') || decision.includes('clear') ? 'go'
                    : decision.includes('no-go') || decision.includes('block') ? 'no-go'
                    : decision.includes('cond') ? 'conditional' : 'error';
                const ts = (a.timestamp || '').slice(0, 19).replace('T', ' ');
                const scenario = (a.scenario || '').length > 50
                    ? (a.scenario || '').slice(0, 50) + '...'
                    : (a.scenario || '');
                html += `<tr>
                    <td style="white-space:nowrap;color:#888;">${ts}</td>
                    <td>${scenario}</td>
                    <td>${a.risk_score ?? '-'}/25</td>
                    <td><span class="badge ${badge}">${a.decision || '-'}</span></td>
                </tr>`;
            }
            html += '</table>';
            el.innerHTML = html;
        }

        async function assessFlight() {
            const scenario = document.getElementById('scenario').value;
            if (!scenario) return;
            const el = document.getElementById('result');
            el.innerHTML = '<div class="loading">Analyzing...</div>';
            try {
                const r = await api('/assess-flight', {
                    method: 'POST',
                    body: JSON.stringify({ scenario })
                });
                el.innerHTML = '<pre>' + JSON.stringify(r, null, 2) + '</pre>';
                loadDashboard();
            } catch (e) {
                el.innerHTML = '<div style="color:#ff4444;">Error: ' + e.message + '</div>';
            }
        }

        if (typeof google !== 'undefined' && google.accounts) {
            initAuth();
        } else {
            document.addEventListener('google-accounts-id-loaded', () => initAuth());
            // Fallback: already loaded via script tag
            setTimeout(() => {
                if (!token && typeof google !== 'undefined' && google.accounts) initAuth();
            }, 1000);
        }
    </script>
</body>
</html>
